services:
  backend:
    build: .
    image: autolube-api:dev
    container_name: autolube-api
    ports:
      - "8000:8000"
      
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped


